server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses BrowserRouter (real paths like /approvals, /audit) -
    # a direct navigation or refresh on any of those must still serve
    # index.html and let the client-side router take over, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
